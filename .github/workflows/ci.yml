name: CVG CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cvg-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_DB: cvg_ci
          POSTGRES_USER: cvg_migration
          POSTGRES_PASSWORD: cvg_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvg_migration -d cvg_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Repository lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

      - name: Security and authorization tests
        run: npm run test:security

      - name: Database and recovery tests
        run: npm run test:database

      - name: Fault and worker tests
        run: npm run test:fault

      - name: Unit and integration tests
        run: npm test

      - name: Provider contract loopback boundary
        run: npm run verify:provider-sandbox

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: License policy
        run: npm run audit:licenses

      - name: Build web artifact
        run: npm run build

      - name: Capture evidence snapshot
        run: npm run verify:evidence-snapshot

      - name: Static verification
        run: npm run verify:static

      - name: Application PDP coverage
        run: npm run verify:pdp

      - name: Universal PDP admission
        run: npm run verify:pdp-universal

      - name: Audit chain tamper gate
        run: npm run verify:audit-chain

      - name: Authoritative write invariants
        run: npm run verify:authoritative-writes

      - name: Contrast audit
        run: npm run audit:contrast

      - name: Design token audit
        run: npm run audit:tokens

      - name: Browser E2E
        run: npm run test:e2e:full

      - name: Upload browser E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cvg-browser-e2e-${{ github.sha }}
          path: |
            artifacts/playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Apply migrations in ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/cvg_ci
          CVG_RUNTIME_DB_USER: cvg_runtime
          CVG_RUNTIME_DB_PASSWORD: cvg_ci_runtime_password
        run: npm run db:migrate

      - name: PostgreSQL integration and RLS gate
        env:
          DATABASE_URL: postgresql://cvg_runtime:cvg_ci_runtime_password@localhost:5432/cvg_ci
          CVG_STORAGE: postgres
          CVG_BOOTSTRAP_PASSWORD: cvg-ci-bootstrap-password
        run: npm run verify:postgres

      - name: PostgreSQL concurrent idempotency gate
        env:
          DATABASE_URL: postgresql://cvg_runtime:cvg_ci_runtime_password@localhost:5432/cvg_ci
          CVG_BOOTSTRAP_PASSWORD: cvg-ci-bootstrap-password
        run: npm run verify:postgres:concurrency

      - name: PostgreSQL restore gate
        env:
          DATABASE_URL: postgresql://cvg_runtime:cvg_ci_runtime_password@localhost:5432/cvg_ci
          MIGRATION_DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/cvg_ci
          ADMIN_DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/postgres
          CVG_RUNTIME_DB_USER: cvg_runtime
          CVG_RUNTIME_DB_PASSWORD: cvg_ci_runtime_password
          CVG_BOOTSTRAP_PASSWORD: cvg-ci-bootstrap-password
        run: npm run verify:postgres:restore

      - name: Verify release and Compose configuration
        run: npm run verify:production

      - name: Synthetic performance baseline
        run: mkdir -p artifacts && npm run benchmark:local > artifacts/benchmark-local.json

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json

      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cvg-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Check diff whitespace
        run: git diff --check

  container-build:
    name: Build API and web images
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Buildx and create OCI API artifact
        run: |
          docker buildx version
          mkdir -p artifacts
          docker buildx build --provenance=false --sbom=false --build-arg CVG_SOURCE_REVISION=${{ github.sha }} --file Dockerfile.api --output=type=oci,dest=artifacts/cvg-api-${{ github.sha }}.oci.tar .

      - name: Create OCI web artifact
        run: docker buildx build --provenance=false --sbom=false --build-arg CVG_SOURCE_REVISION=${{ github.sha }} --file Dockerfile.web --output=type=oci,dest=artifacts/cvg-web-${{ github.sha }}.oci.tar .

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: artifacts/cvg-api-${{ github.sha }}.oci.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: artifacts/cvg-web-${{ github.sha }}.oci.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate and verify same-SHA release provenance
        env:
          CVG_DEEPSEEK_EXPECTED_ENGINE_COMMIT: ${{ vars.CVG_DEEPSEEK_EXPECTED_ENGINE_COMMIT }}
        run: |
          mkdir -p artifacts
          node -e 'const fs=require("node:fs"); const value={schemaVersion:1,sourceSha:process.env.GITHUB_SHA,workflow:process.env.GITHUB_WORKFLOW,runId:process.env.GITHUB_RUN_ID,completedStages:["checks","container-build","trivy-api","trivy-web","sbom"],observedAt:new Date().toISOString()}; fs.writeFileSync("artifacts/ci-results.json", JSON.stringify(value,null,2)+"\n", {mode:0o600})'
          CVG_API_IMAGE_DIGEST="$(tar -xOf artifacts/cvg-api-${{ github.sha }}.oci.tar index.json | node -e 'let value=""; process.stdin.on("data", (chunk) => value += chunk); process.stdin.on("end", () => { const index = JSON.parse(value); const digest = index.manifests?.[0]?.digest; if (typeof digest !== "string" || !/^sha256:[a-f0-9]{64}$/.test(digest)) process.exit(2); process.stdout.write(digest); });')"
          CVG_WEB_IMAGE_DIGEST="$(tar -xOf artifacts/cvg-web-${{ github.sha }}.oci.tar index.json | node -e 'let value=""; process.stdin.on("data", (chunk) => value += chunk); process.stdin.on("end", () => { const index = JSON.parse(value); const digest = index.manifests?.[0]?.digest; if (typeof digest !== "string" || !/^sha256:[a-f0-9]{64}$/.test(digest)) process.exit(2); process.stdout.write(digest); });')"
          export CVG_API_IMAGE_DIGEST CVG_WEB_IMAGE_DIGEST
          npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json
          npm run release:provenance -- --write artifacts/release-provenance.json
          npm run verify:release-provenance -- --manifest artifacts/release-provenance.json

      - name: Upload release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cvg-release-provenance-${{ github.sha }}
          path: |
            artifacts/release-provenance.json
            artifacts/sbom.cdx.json
            artifacts/ci-results.json
            artifacts/cvg-api-${{ github.sha }}.oci.tar
            artifacts/cvg-web-${{ github.sha }}.oci.tar
          if-no-files-found: error
