name: CVG CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cvg-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_DB: cvg_ci
          POSTGRES_USER: cvg_migration
          POSTGRES_PASSWORD: cvg_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvg_migration -d cvg_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Repository lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract

      - name: Security and authorization tests
        run: npm run test:security

      - name: Database and recovery tests
        run: npm run test:database

      - name: Fault and worker tests
        run: npm run test:fault

      - name: Unit and integration tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: License policy
        run: npm run audit:licenses

      - name: Build web artifact
        run: npm run build

      - name: Static verification
        run: npm run verify:static

      - name: Contrast audit
        run: npm run audit:contrast

      - name: Design token audit
        run: npm run audit:tokens

      - name: Browser E2E
        run: npm run test:e2e

      - name: Apply migrations in ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/cvg_ci
          CVG_RUNTIME_DB_USER: cvg_runtime
          CVG_RUNTIME_DB_PASSWORD: cvg_ci_runtime_password
        run: npm run db:migrate

      - name: PostgreSQL integration and RLS gate
        env:
          DATABASE_URL: postgresql://cvg_runtime:cvg_ci_runtime_password@localhost:5432/cvg_ci
          CVG_STORAGE: postgres
          CVG_BOOTSTRAP_PASSWORD: cvg-ci-bootstrap-password
        run: npm run verify:postgres

      - name: PostgreSQL restore gate
        env:
          DATABASE_URL: postgresql://cvg_runtime:cvg_ci_runtime_password@localhost:5432/cvg_ci
          MIGRATION_DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/cvg_ci
          ADMIN_DATABASE_URL: postgresql://cvg_migration:cvg_ci_password@localhost:5432/postgres
          CVG_RUNTIME_DB_USER: cvg_runtime
          CVG_RUNTIME_DB_PASSWORD: cvg_ci_runtime_password
          CVG_BOOTSTRAP_PASSWORD: cvg-ci-bootstrap-password
        run: npm run verify:postgres:restore

      - name: Verify release and Compose configuration
        run: npm run verify:production

      - name: Synthetic performance baseline
        run: mkdir -p artifacts && npm run benchmark:local > artifacts/benchmark-local.json

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json

      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cvg-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Check diff whitespace
        run: git diff --check

  container-build:
    name: Build API and web images
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build API image
        run: docker build --file Dockerfile.api --tag cvg-corp/api:ci .

      - name: Build web image
        run: docker build --file Dockerfile.web --tag cvg-corp/web:ci .

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cvg-corp/api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cvg-corp/web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
