name: cvg-corp-observability

# Local/staging topology only. Pin image digests before any production use;
# this file does not claim that the stack has been executed in this workspace.
services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.133.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    expose: ["4317", "4318", "8889", "13133"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 6

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.7.2}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/tempo.yaml:ro
      - cvg_tempo_data:/var/tempo
    expose: ["3200", "4317"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [observability]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - cvg_prometheus_data:/prometheus
    expose: ["9090"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [observability]
    depends_on:
      otel-collector:
        condition: service_healthy

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - cvg_alertmanager_data:/alertmanager
    expose: ["9093"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [observability]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be supplied through an external env file}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be supplied through an external env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - cvg_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [observability]
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  cvg_tempo_data:
  cvg_prometheus_data:
  cvg_alertmanager_data:
  cvg_grafana_data:

networks:
  observability:
    internal: true
