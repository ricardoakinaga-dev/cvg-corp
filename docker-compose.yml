name: cvg-corp-local

services:
  postgres:
    image: postgres:18.0-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvg_local
      POSTGRES_USER: ${CVG_MIGRATION_DB_USER:-cvg_migration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied through an external env file}
    ports:
      - "127.0.0.1:${CVG_POSTGRES_PORT:-5440}:5432"
    volumes:
      - cvg_corp_pgdata:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CVG_MIGRATION_DB_USER:-cvg_migration} -d cvg_local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    image: ${CVG_API_IMAGE:-cvg-corp/api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "--import", "tsx", "scripts/db.ts", "migrate"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must be supplied with an URL-encoded password}
      CVG_RUNTIME_DB_USER: ${CVG_RUNTIME_DB_USER:-cvg_runtime}
      CVG_RUNTIME_DB_PASSWORD: ${CVG_RUNTIME_DB_PASSWORD:?CVG_RUNTIME_DB_PASSWORD must be supplied through an external env file}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      disable: true
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  api:
    image: ${CVG_API_IMAGE:-cvg-corp/api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CVG_HOST: 0.0.0.0
      CVG_TRUST_PROXY: ${CVG_TRUST_PROXY:-false}
      CVG_API_PORT: 4310
      CVG_WEB_ORIGIN: ${CVG_WEB_ORIGIN:-http://localhost:8080}
      CVG_STORAGE: postgres
      CVG_DEMO_MODE: ${CVG_DEMO_MODE:-true}
      CVG_BOOTSTRAP_PASSWORD: ${CVG_BOOTSTRAP_PASSWORD:?CVG_BOOTSTRAP_PASSWORD must be supplied through an external env file}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be supplied with an URL-encoded password}
      CVG_SECRET_PROVIDER: ${CVG_SECRET_PROVIDER:-none}
      CVG_SECRET_DIR: ${CVG_SECRET_DIR:-/run/secrets/cvg}
      CVG_AUTH_MFA_MODE: ${CVG_AUTH_MFA_MODE:-disabled}
      CVG_PASSWORD_MIN_LENGTH: ${CVG_PASSWORD_MIN_LENGTH:-12}
      CVG_PASSWORD_MAX_AGE_DAYS: ${CVG_PASSWORD_MAX_AGE_DAYS:-90}
      CVG_AUTH_MAX_FAILED_ATTEMPTS: ${CVG_AUTH_MAX_FAILED_ATTEMPTS:-8}
      CVG_AUTH_LOCKOUT_MINUTES: ${CVG_AUTH_LOCKOUT_MINUTES:-15}
      CVG_AUTH_CHALLENGE_TTL_SECONDS: ${CVG_AUTH_CHALLENGE_TTL_SECONDS:-300}
      CVG_AUTH_MAX_CHALLENGE_ATTEMPTS: ${CVG_AUTH_MAX_CHALLENGE_ATTEMPTS:-5}
      CVG_RATE_LIMIT_BACKEND: ${CVG_RATE_LIMIT_BACKEND:-local}
      CVG_RATE_LIMIT_REQUESTS_PER_WINDOW: ${CVG_RATE_LIMIT_REQUESTS_PER_WINDOW:-120}
      CVG_RATE_LIMIT_WINDOW_SECONDS: ${CVG_RATE_LIMIT_WINDOW_SECONDS:-60}
      CVG_DEEPSEEK_BASE_URL: ${CVG_DEEPSEEK_BASE_URL:-https://deepseek.invalid}
      CVG_DEEPSEEK_RUNTIME_ENABLED: ${CVG_DEEPSEEK_RUNTIME_ENABLED:-false}
      CVG_DEEPSEEK_EXPECTED_ENGINE_COMMIT: ${CVG_DEEPSEEK_EXPECTED_ENGINE_COMMIT:-0000000000000000000000000000000000000000}
      CVG_DEEPSEEK_EXPECTED_MANIFEST_VERSION: ${CVG_DEEPSEEK_EXPECTED_MANIFEST_VERSION:-local-placeholder}
      CVG_DEEPSEEK_BEARER_TOKEN_REF: ${CVG_DEEPSEEK_BEARER_TOKEN_REF:-cvg-deepseek-token}
      CVG_DEEPSEEK_CONTEXT_SIGNING_SECRET_REF: ${CVG_DEEPSEEK_CONTEXT_SIGNING_SECRET_REF:-cvg-deepseek-context-signing}
      CVG_RECOVERY_ENCRYPTION_KEY_REF: ${CVG_RECOVERY_ENCRYPTION_KEY_REF:-cvg-recovery-encryption-key}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_API_SERVICE_NAME:-cvg-api}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks:
      - backend
      - observability
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node --input-type=module -e "fetch('http://127.0.0.1:4310/api/v1/ready').then(async (response) => { const body = await response.json(); if (!response.ok || body?.data?.ready !== true) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s

  web:
    image: ${CVG_WEB_IMAGE:-cvg-corp/web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    image: ${CVG_API_IMAGE:-cvg-corp/api:local}
    command: ["node", "--import", "tsx", "docker/worker.ts"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be supplied with an URL-encoded password}
      CVG_WORKER_ORGANIZATION_ID: ${CVG_WORKER_ORGANIZATION_ID:?CVG_WORKER_ORGANIZATION_ID must be supplied through an external env file}
      CVG_WORKER_ID: ${CVG_WORKER_ID:-cvg-worker-local}
      CVG_WORKER_INTERVAL_MS: ${CVG_WORKER_INTERVAL_MS:-5000}
      CVG_WORKER_MAX_OUTSTANDING: ${CVG_WORKER_MAX_OUTSTANDING:-1000}
      CVG_WORKER_SINK_MODE: ${CVG_WORKER_SINK_MODE:-quarantine}
      CVG_WORKER_HEARTBEAT_FILE: /tmp/cvg-worker/heartbeat
      CVG_BACKUP_ENABLED: ${CVG_BACKUP_ENABLED:-false}
      CVG_BACKUP_ORGANIZATION_ID: ${CVG_BACKUP_ORGANIZATION_ID:-}
      CVG_BACKUP_DIRECTORY: ${CVG_BACKUP_DIRECTORY:-}
      CVG_BACKUP_INTERVAL_MS: ${CVG_BACKUP_INTERVAL_MS:-3600000}
      CVG_BACKUP_KEEP_LAST: ${CVG_BACKUP_KEEP_LAST:-7}
      CVG_RECOVERY_ENCRYPTION_KEY_REF: ${CVG_RECOVERY_ENCRYPTION_KEY_REF:-}
      CVG_SECRET_PROVIDER: ${CVG_SECRET_PROVIDER:-none}
      CVG_SECRET_DIR: ${CVG_SECRET_DIR:-/run/secrets/cvg}
      CVG_MESSAGING_PROVIDER_ENDPOINT: ${CVG_MESSAGING_PROVIDER_ENDPOINT:-}
      CVG_MESSAGING_PROVIDER_ALLOWED_HOSTS: ${CVG_MESSAGING_PROVIDER_ALLOWED_HOSTS:-}
      CVG_MESSAGING_CREDENTIAL_REF: ${CVG_MESSAGING_CREDENTIAL_REF:-}
      CVG_MESSAGING_SEND_PATH: ${CVG_MESSAGING_SEND_PATH:-/messages}
      CVG_MESSAGING_QUERY_PATH: ${CVG_MESSAGING_QUERY_PATH:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_WORKER_SERVICE_NAME:-cvg-worker}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - cvg_corp_backups:/var/lib/cvg/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks:
      - backend
      - observability
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/cvg-worker/heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/cvg-worker/heartbeat) )) -lt 60
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s

  proxy:
    image: nginxinc/nginx-unprivileged:1.31.5-alpine3.24@sha256:2ddec616f1cb58bcac057aa388f28cb81e35137641ef4226d321714499329bd1
    ports:
      - "${CVG_PROXY_BIND:-127.0.0.1}:${CVG_PROXY_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "101"
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  cvg_corp_pgdata:
  cvg_corp_backups:

networks:
  backend:
    internal: true
  observability:
    name: ${CVG_OBSERVABILITY_NETWORK:-cvg-corp-observability}
    internal: true
