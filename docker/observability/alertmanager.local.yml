# Controlled local receiver contract. Start a synthetic receiver on
# 127.0.0.1:18080 only when exercising routing; this URL is not an external
# notification authority and must never be used as production configuration.
route:
  receiver: cvg-local-drill
  group_by: [alertname, severity, owner, channel]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: cvg-local-drill
    webhook_configs:
      - url: http://host.docker.internal:18080/alerts
        send_resolved: true
