name: cvg-corp-observability-local

# Synthetic local stack only. It persists collector logs and Prometheus/
# Alertmanager state in explicitly named volumes. It does not include API,
# worker, PostgreSQL, provider or any real-data source.
services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.133.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.durable.yml:/etc/otelcol-contrib/config.yaml:ro
      - cvg_observability_logs:/var/lib/cvg/observability
    ports:
      - "127.0.0.1:${CVG_OTEL_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${CVG_OTEL_HTTP_PORT:-14318}:4318"
      - "127.0.0.1:${CVG_OTEL_METRICS_PORT:-18889}:8889"
      - "127.0.0.1:${CVG_OTEL_HEALTH_PORT:-11333}:13133"
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - cvg_prometheus_local_data:/prometheus
    ports:
      - "127.0.0.1:${CVG_PROMETHEUS_PORT:-19090}:9090"
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability]
    depends_on:
      otel-collector:
        condition: service_healthy

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
      - cvg_alertmanager_local_data:/alertmanager
    ports:
      - "127.0.0.1:${CVG_ALERTMANAGER_PORT:-19093}:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [observability]

volumes:
  cvg_observability_logs:
  cvg_prometheus_local_data:
  cvg_alertmanager_local_data:

networks:
  observability:
    name: ${CVG_OBSERVABILITY_LOCAL_NETWORK:-cvg-corp-observability-local}
    internal: true
