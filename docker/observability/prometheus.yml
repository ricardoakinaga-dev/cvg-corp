global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cvg-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:4310"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
