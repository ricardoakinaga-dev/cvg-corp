global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# CVG-AUD19-021: alerts must reach the Alertmanager receiver.  The connection
# is part of the structural production verification.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cvg-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:4310"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
